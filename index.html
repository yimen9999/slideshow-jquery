<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow con jQuery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="cabecera">
        <p class="cabecera__kicker">Diseño Web Avanzado · Tema 4</p>
        <h1>Slideshow con jQuery</h1>
        <p class="cabecera__texto">Las instrucciones están en <code>js/script.js</code>.</p>
    </header>

    <main class="slideshow">

        <!-- Las diapositivas: solo la primera se ve al cargar (lo hace el CSS).
             Imágenes de ejemplo de Lorem Picsum (fotos de Unsplash). -->
        <div class="slideshow__pantalla">
            <img class="slide" src="https://picsum.photos/seed/dwa-slide-1/1200/675" alt="Imagen de ejemplo 1">
            <img class="slide" src="https://picsum.photos/seed/dwa-slide-2/1200/675" alt="Imagen de ejemplo 2">
            <img class="slide" src="https://picsum.photos/seed/dwa-slide-3/1200/675" alt="Imagen de ejemplo 3">
            <img class="slide" src="https://picsum.photos/seed/dwa-slide-4/1200/675" alt="Imagen de ejemplo 4">
        </div>

        <!-- Controles -->
        <div class="slideshow__controles">
            <button type="button" class="boton" id="anterior" aria-label="Diapositiva anterior">←</button>
            <p class="slideshow__contador" id="contador">1 / 4</p>
            <button type="button" class="boton" id="siguiente" aria-label="Diapositiva siguiente">→</button>
        </div>

    </main>

    <!-- PASO 0: enlaza aquí, en este orden:
         1) jQuery desde su CDN
         2) tu archivo js/script.js -->

         <!-- cuando cargamos la libreria jquery antes de nuestro archivo js -->
            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- carga el scrpts -->
     <script src="js/script.js"></script>
    
</body>
</html>
